name: Deploy docs

on:
  push:
    branches: [main]
  # A source repo (lithos, influx, lithos-loom, lithos-lens) moved: rebuild so
  # the build-time imports (sources.toml) and the deployed site follow it.
  repository_dispatch:
    types: [upstream-changed]
  # Backstop for upstream pushes that did not dispatch.
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC, after the drift check
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull build-time imports from the source repos
        run: python3 scripts/sync_sources.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4