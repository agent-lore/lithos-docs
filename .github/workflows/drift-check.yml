name: Drift check

# Asserts the docs site agrees with the lithos repo's generated tool catalog,
# that every build-time import in sources.toml is gitignored and still exists
# upstream, and that no stale markers appear. The weekly run is the backstop:
# it fails when a source repo moves and the site hasn't — that failure IS the
# "docs are stale" signal, independent of any PR activity here.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs against the source repos' main
        run: python3 scripts/check_drift.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
